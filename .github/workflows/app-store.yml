name: Build and publish RouterOS App Store

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install checksum-pinned toolchain
        run: python3 scripts/bootstrap-tools.py
      - name: Verify UI matches committed bundle
        run: python3 scripts/build-webui.py --check
      - name: Test controller
        run: |
          SING_BOX_BINARY="$PWD/.cache/sing-box-1.14.2-linux-amd64/sing-box" .cache/go/bin/go test -race ./...
          .cache/go/bin/go vet ./...
          python3 tests/integration/app_image.py
          python3 tests/integration/alpine_sources.py
          python3 scripts/ci-test-publication.py
      - name: Build distributable images and source closure
        run: python3 scripts/build-distributable-image.py --out .cache/app-image --go .cache/go/bin/go
      - name: Verify exact image graph
        run: python3 scripts/verify-app-image.py --out .cache/app-image
      - name: Smoke-check the actual source-built engine
        run: |
          python3 tests/integration/namespace_policy.py --sing-box .cache/app-image/sing-box-amd64
          python3 tests/integration/binding_policy.py --sing-box .cache/app-image/sing-box-amd64
          python3 tests/integration/smoke.py --go .cache/go/bin/go --sing-box .cache/app-image/sing-box-amd64
      - name: Verify corresponding sources and package
        run: python3 scripts/ci-package.py --image-dir .cache/app-image --out .cache/package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-store-build-${{ github.sha }}
          path: |
            .cache/app-image/
            .cache/package/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-store-build-${{ github.sha }}
          path: .cache
      - name: Install checksum-pinned toolchain for offline source reproduction
        run: python3 scripts/bootstrap-tools.py
      - name: Re-verify downloaded source closure
        run: python3 scripts/verify-distribution-sources.py --image-dir .cache/app-image
      - name: Upload immutable multi-platform image to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          python3 scripts/publish-ghcr.py --layout .cache/app-image/oci --repository "$repository" --tag "sha-$GITHUB_SHA" --output .cache/publication.json
      - name: Render catalog only after registry digest verification
        run: |
          image="$(python3 -c 'import json; print(json.load(open(".cache/publication.json"))["image"])')"
          python3 scripts/render-app.py --image "$image" --build .cache/app-image/build.json --out .cache/site
          cp .cache/package/SHA256SUMS .cache/site/SHA256SUMS
          cp .cache/package/provenance.json .cache/site/provenance.json
          cp .cache/publication.json .cache/site/publication.json
      - name: Publish a source-complete build release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-$GITHUB_SHA"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Experimental build $GITHUB_SHA" --notes "Personal-use experimental build. No warranties. Read README limitations before installation. Image digest and corresponding sources are attached."
          fi
          gh release upload "$tag" .cache/package/* .cache/site/app.yml .cache/site/catalog.yml .cache/publication.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Require anonymous RouterOS image access
        run: |
          image="$(python3 -c 'import json; print(json.load(open(".cache/publication.json"))["image"])')"
          python3 scripts/ci-check-public-image.py --image "$image" --output .cache/site/anonymous-pull.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .cache/site
      - name: Publish RouterOS catalog
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
